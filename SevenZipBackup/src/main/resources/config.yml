# SevenZipBackup   -   by Windsor Macmillan

version: 5

# Backup interval in minutes.
# 备份间隔，单位分钟
delay: 60
# How many backups to keep before deleting the oldest one. Set this to -1 to disable automatic deletes.
# 保存上限，超过则清理最旧的备份。禁用此项请改为 -1
keep-count: -1
local-keep-count: -1

# Compress level for 7zip archive [0-9]. 0 refers to super-fast. 9 refers to extreme-compression. Increasing this value can create smaller backup.
# Based on actual testing, we STRONGLY RECOMMEND level 5 or lower.
# WARNING: Beyond this value, compression rate would NOT improve significantly, while time and memory consumption increase exponentially.
# 7z压缩级别[0-9]，0代表最快速度，9代表极限压缩。提高此值可以获得更小体积的备份。
# 经过实测强烈建议选用5及以下，超过此值压缩率不会显著改善，但消耗时间和内存成倍增加。
# 警告：过高的值可能会消耗巨量内存和CPU资源。
7z-compression-level: 5
# Compressing thread counts. Each thread can process backups creation in parallel.
# Default is 4. Based on directories you need to create backups.
# 压缩线程数量。每个线程可以并行地创建备份文件。
# 默认值为4。此值基于你需要创建备份的文件夹数量。
backup-thread-counts: 4

# Whether to enable CPU affinity to specify which CPU cores are used during compression.
# The 7zr executable uses the -stm{HexMask} switch; the plugin converts the configured
# core list into this hex affinity mask. When disabled, no parameter is added (all cores used).
# 是否启用CPU亲和性，以指定压缩时使用哪些CPU核心。
# 7zr 使用 -stm{HexMask} 参数；插件会将配置的核心列表转换为该十六进制亲和掩码。
# 关闭时，不添加参数，即使用全部核心。
enable-specify-cpu-cores: false
# Bind to specific CPU cores (comma-separated, 0 to N-1). "-1" means auto (use all cores).
# If any number is an invalid core id, the plugin falls back to the default (all cores).
# 绑定到特定CPU核心（逗号分隔，0到N-1）。"-1"表示自动（使用全部核心）。
# 如果其中有无效的CPU核心编号，则回退至默认（使用全部核心）。
cpu-cores-list: "-1"

#只在有玩家在线时启用备份
backups-require-players: true
#在备份时暂时挂起世界保存
disable-saving-during-backups: true
#备份时显示boos栏进度条
show-bossbar-progress: true
#You can choose from 7 colors: BLUE, GREEN, PINK, PURPLE, RED, WHITE and YELLOW
#可用7钟颜色：BLUE, GREEN, PINK, PURPLE, RED, WHITE and YELLOW
bossbar-color: "BLUE"
#You can choose from 5 styles: SOLID, SEGMENT_6, SEGMENT_10, SEGMENT_12, SEGMENT_20
#可用风格：SOLID, SEGMENT_6, SEGMENT_10, SEGMENT_12, SEGMENT_20
bossbar-style: "SOLID"


scheduled-backups: false
backup-schedule-list:

backup-list:
  # Backup all kinds of world
  # 备份所有世界文件夹（按正则匹配顶层文件夹名）
  - glob: ".*world.*"
    format: "Backup-%NAME-%FORMAT.zip"
    create: true
  # Backup plugins' data, but exclude jars, remapped jars and cache files
  # 备份插件数据，但不包含插件本体、重映射缓存和缓存文件
  - path: "plugins"
    format: "Backup-plugins-%FORMAT.zip"
    create: true
    blacklist:
      - "^[^/]*\\.jar$"
      - "\\.paper-remapped/.*"
      - ".*cache.*"

external-backup-list:

local-save-directory: "backups"
remote-save-directory: "backups"

googledrive:
  enabled: false
  shared-drive-id: ""
  # OAuth client ID for a Google Cloud "TVs and Limited Input devices" client.
  # Google Drive account linking requires this client type. Do not enter a client secret here.
  # Google Drive 账户链接需要 Google Cloud 中“电视和受限输入设备”类型的 OAuth 客户端 ID。
  # 此处无需填写客户端密钥。
  oauth-device-client-id: ""
onedrive:
  enabled: false
dropbox:
  enabled: false
  # Dropbox does NOT support the device-code flow, and the plugin's original online
  # authorization relay (drivebackup.com) has expired. You must create your own App at
  # https://www.dropbox.com/developers/apps and fill in the credentials + refresh_token
  # manually. See README "DropBox" section for step-by-step instructions.
  # Leave both empty to fall back to the built-in App of the original author
  # (only works if your refresh_token was issued by that App).
  # Dropbox 不支持设备码流程，且原有的在线授权中转服务（drivebackup.com）域名已过期。
  # 需要自行在 https://www.dropbox.com/developers/apps 创建 App，并手动填写凭据与 refresh_token，
  # 详细步骤见 README 的「DropBox」小节。留空则回退到原作者内置的 App
  #（仅当你的 refresh_token 由该 App 签发时才可用）。
  client-id: ""
  client-secret: ""
webdav:
  enabled: false
  hostname: "http://example.com/directory"
  username: "Username"
  password: "Password"
nextcloud:
  enabled: false
  hostname: "https://example.com/remote.php/dav/files/user/"
  username: "Username"
  password: "Password"
  chunk-size: 20_000_000
s3:
  enabled: false
  endpoint: "https://s3.us-west-2.amazonaws.com"
  access-key: "AKIAxxxxxxxxxxxxxxxx"
  secret-key: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  bucket: "bucket"
ftp:
  enabled: false
  hostname: "ftp.example.com"
  port: 21
  sftp: false
  ftps: false
  username: "Username"
  password: "Password"
  sftp-public-key: 
  sftp-passphrase: 
  working-dir:

messages:
  send-in-chat: true
  # prefix: "&6[&f7&8z&bBackup&6] "
  prefix: "&6[&f7&8z&b备份&6] "
  default-color: "&9"

advanced:
  metrics: true
  update-check: true
  suppress-errors: false
  debug: false
  date-language: "cn"
  # UTC
  date-timezone: "+08:00"
  ftp-file-separator: "/"
  # Whether backup locations (glob:) and blacklist entries are interpreted as REGEX.
  # true  -> the string is a Java regex, matched against the whole relative path
  #          (e.g. ".*\.jar$" excludes jars at any depth, "spark/.*\.hprof" targets one folder).
  # false -> the string is a glob, also required to match the whole name/path
  #          ("*" does NOT cross directory separators, use "**" for that).
  # Backslashes in regex must be doubled in YAML, or use single quotes: '.*\.hprof'
  # 备份位置（glob:）与黑名单条目是否按「正则」解释。
  # true  -> 按 Java 正则处理，与整条相对路径做完整匹配
  #          （如 ".*\.jar$" 排除任意层级的 jar，"spark/.*\.hprof" 只针对单个目录）。
  # false -> 按 glob 处理，同样要求完整匹配文件名/路径
  #          （glob 的 "*" 不跨越目录分隔符，跨层级请用 "**"）。
  # 注意：正则里的反斜杠在 YAML 中需要双写，或改用单引号：'.*\.hprof'
  blacklist-regex: true
